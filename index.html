<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calendar Elegant"><title>Calendar Elegant</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:#2a2118;color:#f8f1e5}body{display:flex;flex-direction:column;position:relative}#bg-svg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity .9s ease}#bg-svg svg{width:100%;height:100%}.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(20,16,12,.35),rgba(42,33,24,.9))}.container{position:relative;z-index:2;height:100%;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,12px);gap:8px}header{display:flex;justify-content:space-between;align-items:flex-end}#clock{font-size:96px;font-weight:300;letter-spacing:-1.5px;color:#fdf6eb;text-shadow:0 3px 18px rgba(0,0,0,.55)}#date-right{font-family:Georgia,serif;font-size:38px;font-style:italic;color:#e8c9a0;text-align:right;max-width:55%}.calendar-section,.verse-section,.music-section{background:rgba(255,248,235,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,240,220,.18)}.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.cal-nav{background:rgba(255,248,235,.16);border:none;color:#f5e8d5;width:32px;height:32px;border-radius:50%;font-size:17px}#cal-title{font-family:Georgia,serif;font-size:26px;font-style:italic;color:#e8c9a0}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.weekdays{margin-bottom:4px;text-align:center;font-size:12px;color:rgba(245,232,213,.55)}.day{height:48px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:8px}.day.other-month{color:rgba(253,246,235,.18)}.day.today{background:linear-gradient(145deg,#d4a574,#c4925e);color:#2a2118;font-weight:600}.verse-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#d4a574;margin-bottom:6px}#verse-text{font-family:Georgia,serif;font-size:26px;line-height:1.35}#verse-ref{margin-top:6px;font-size:14px;color:rgba(245,232,213,.55);font-style:italic}.music-section{display:flex;align-items:center;gap:10px}.music-info{flex:1;min-width:0}#track-title{font-size:13px;font-weight:500}#track-artist{font-size:11px;color:rgba(245,232,213,.5)}.music-controls{display:flex;gap:6px}.music-btn{background:rgba(255,248,235,.12);border:none;color:#f5e8d5;width:34px;height:34px;border-radius:50%}.music-btn.play{background:linear-gradient(145deg,#d4a574,#c4925e);color:#2a2118;width:40px;height:40px}.footer-note{text-align:center;font-size:9px;color:rgba(245,232,213,.25)}@media(max-width:480px){#clock{font-size:56px}#date-right{font-size:22px;text-align:left;max-width:100%}header{flex-direction:column;align-items:flex-start}.day{height:34px;font-size:14px}#verse-text{font-size:17px}}</style></head><body><div id="bg-svg" style="opacity:1"></div><div class="overlay"></div><div class="container"><header><div id="clock">01:30</div><div id="date-right">Duminică 25 octombrie</div></header><div class="calendar-section"><div class="cal-header"><button class="cal-nav" id="prev-month">‹</button><div id="cal-title">Octombrie 2026</div><button class="cal-nav" id="next-month">›</button></div><div class="weekdays"><div>Lu</div><div>Ma</div><div>Mi</div><div>Jo</div><div>Vi</div><div>Sâ</div><div>Du</div></div><div class="days" id="days-grid"></div></div><div class="verse-section"><div class="verse-label">Versetul zilei</div><div id="verse-text">Umblăm prin credință, nu prin vedere.</div><div id="verse-ref">2 Corinteni 5:7</div></div><div class="music-section"><div class="music-info"><div id="track-title">Soft Piano Jazz</div><div id="track-artist">Ambient Offline</div></div><div class="music-controls"><button class="music-btn" id="prev-track">⏮</button><button class="music-btn play" id="play-btn">▶</button><button class="music-btn" id="next-track">⏭</button><button class="music-btn" onclick="window.open('https://militar-player.vercel.app','_blank')" title="Deschide MILITAR Player" style="width:auto;padding:0 10px;border-radius:8px;font-size:11px">MILITAR</button></div></div><div class="footer-note">Calendar Elegant • 100% offline • Player conectat</div></div><script>(function(){var currentDate=new Date(),viewDate=new Date(currentDate.getFullYear(),currentDate.getMonth(),1),currentTrack=0,isPlaying=false;var audioCtx=null,masterGain=null,oscillators=[],intervalId=null;var monthNames=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];var monthNamesCap=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];var dayNames=["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];var tracks=[{title:"Soft Piano Jazz",artist:"Ambient Offline",type:"piano"},{title:"Deep Bass Lounge",artist:"Ambient Offline",type:"bass"},{title:"Sax Evening",artist:"Ambient Offline",type:"sax"},{title:"Chill Waves",artist:"Ambient Offline",type:"chill"}];function updateClock(){var now=new Date();document.getElementById("clock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");document.getElementById("date-right").textContent=dayNames[now.getDay()]+" "+now.getDate()+" "+monthNames[now.getMonth()];}setInterval(updateClock,1000);updateClock();function renderCalendar(){var year=viewDate.getFullYear(),month=viewDate.getMonth();document.getElementById("cal-title").textContent=monthNamesCap[month]+" "+year;var firstDay=new Date(year,month,1),startDay=firstDay.getDay()-1;if(startDay<0)startDay=6;var daysInMonth=new Date(year,month+1,0).getDate(),daysInPrev=new Date(year,month,0).getDate(),grid=document.getElementById("days-grid");grid.innerHTML="";var i,d,today=new Date();for(i=startDay-1;i>=0;i--){d=document.createElement("div");d.className="day other-month";d.textContent=daysInPrev-i;grid.appendChild(d);}for(i=1;i<=daysInMonth;i++){d=document.createElement("div");d.className="day";if(i===today.getDate()&&month===today.getMonth()&&year===today.getFullYear())d.classList.add("today");d.textContent=i;grid.appendChild(d);}var total=grid.children.length,target=total<=35?35:42;for(i=1;total+i<=target;i++){d=document.createElement("div");d.className="day other-month";d.textContent=i;grid.appendChild(d);}}document.getElementById("prev-month").onclick=function(){viewDate.setMonth(viewDate.getMonth()-1);renderCalendar();};document.getElementById("next-month").onclick=function(){viewDate.setMonth(viewDate.getMonth()+1);renderCalendar();};function setDailyVerse(){document.getElementById("verse-text").textContent="Umblăm prin credință, nu prin vedere.";document.getElementById("verse-ref").textContent="2 Corinteni 5:7";}function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.18;masterGain.connect(audioCtx.destination);}if(audioCtx.state==="suspended")audioCtx.resume();}function stopMusic(){if(intervalId){clearInterval(intervalId);intervalId=null;}oscillators.forEach(function(o){try{o.stop();}catch(e){}});oscillators=[];}function playNote(freq,duration,type,delay){if(!audioCtx)return;var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type||"sine";osc.frequency.value=freq;gain.gain.setValueAtTime(0,audioCtx.currentTime+delay);gain.gain.linearRampToValueAtTime(0.25,audioCtx.currentTime+delay+0.08);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+duration);osc.connect(gain);gain.connect(masterGain);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+duration+0.1);oscillators.push(osc);}var progressions={piano:[[261.63,329.63,392],[293.66,349.23,440],[329.63,392,493.88],[349.23,440,523.25]],bass:[[130.81,164.81,196],[146.83,174.61,220],[164.81,196,246.94],[174.61,220,261.63]],sax:[[349.23,440,523.25],[392,493.88,587.33],[329.63,415.3,493.88],[293.66,369.99,440]],chill:[[220,277.18,329.63],[246.94,311.13,369.99],[261.63,329.63,392],[196,246.94,293.66]]};function startTrack(type){stopMusic();initAudio();var prog=progressions[type]||progressions.piano,step=0;function playChord(){var chord=prog[step%prog.length],oscType=type==="bass"?"triangle":(type==="sax"?"sawtooth":"sine");chord.forEach(function(freq,i){playNote(freq,2.8,oscType,i*0.04);});step++;}playChord();intervalId=setInterval(playChord,3200);}function loadTrack(index){currentTrack=(index+tracks.length)%tracks.length;var t=tracks[currentTrack];document.getElementById("track-title").textContent=t.title;document.getElementById("track-artist").textContent=t.artist;if(isPlaying)startTrack(t.type);}var playBtn=document.getElementById("play-btn");playBtn.onclick=function(){if(isPlaying){stopMusic();playBtn.textContent="▶";isPlaying=false;}else{initAudio();startTrack(tracks[currentTrack].type);playBtn.textContent="⏸";isPlaying=true;}};document.getElementById("prev-track").onclick=function(){loadTrack(currentTrack-1);};document.getElementById("next-track").onclick=function(){loadTrack(currentTrack+1);};renderCalendar();setDailyVerse();loadTrack(0);})();</script></body></html>
